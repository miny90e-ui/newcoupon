# /etc/nginx/sites-available/new-coupon
# Replace newcoupon.com with your domain, then run certbot (see DEPLOY.md) to add HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name newcoupon.com www.newcoupon.com;

    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Uploaded logos and banners, served straight from disk
    location /uploads/ {
        alias /var/www/new-coupon-uploads/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
