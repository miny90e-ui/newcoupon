name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-only-secret-not-used-at-runtime-0000
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/ci

  # Only runs when the repository variable DEPLOY_VPS is "true" (see DEPLOY.md, step 6).
  # On Vercel, deploys happen automatically and this job is skipped.
  deploy:
    needs: check
    if: vars.DEPLOY_VPS == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy script on the VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: |
            cd /var/www/new-coupon
            bash deploy/deploy.sh
